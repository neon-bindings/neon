[package]
name = "napi-tests"
version = "0.1.0"
authors = ["The Neon Community <david.herman@gmail.com>"]
license = "MIT"
exclude = ["artifacts.json", "index.node"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
either = "1.13.0"
num-bigint-dig = "0.9.1"
once_cell = "1.18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.34.0", features = ["rt-multi-thread"] }
ts-rs = { version = "12", features = ["indexmap-impl"] }
indexmap = { version = "2", features = ["serde"] }
neon-ts-rs = { path = "../../crates/neon-ts-rs" }
neon-typescript = { path = "../../crates/neon-typescript" }

[dependencies.neon]
path = "../../crates/neon"
features = ["futures", "napi-experimental", "external-buffers", "serde", "tokio", "typescript"]
