name: Website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "crates/neon/**"
      - "crates/neon-macros/**"
      - ".github/workflows/website.yml"
  pull_request:
    branches:
      - main
    paths:
      - "website/**"
      - "crates/neon/**"
      - "crates/neon-macros/**"
      - ".github/workflows/website.yml"

jobs:
  doctests:
    name: Doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nightly matches the rest of the pipeline (the prebuild runs
      # `cargo +nightly neon-doc` to mirror docs.rs), so doctests run
      # against the same toolchain users see on docs.rs.
      - name: Use Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run website doctests
        run: cargo test -p website --doc

  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Astro prebuild runs `cargo +nightly neon-doc` to produce
      # the same rustdoc as docs.rs, which requires nightly because of
      # the `--cfg docsrs` feature gates in the neon crate.
      - name: Use Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build website
        run: npm run build --workspace=@neon-rs/website

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          retention-days: 7
