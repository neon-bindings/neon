[package]
name = "neon-macros"
version = "1.1.1"
authors = ["Dave Herman <david.herman@gmail.com>"]
description = "Procedural macros supporting Neon"
repository = "https://github.com/neon-bindings/neon"
license = "MIT/Apache-2.0"
edition = "2021"

[lib]
proc-macro = true

[features]
# Enables emission of TypeScript metadata from the export/class macros. Neon
# turns this on via its own `typescript` feature. When off, the macros emit no
# metadata statics, so `#[neon::export]` has zero TypeScript-related code-size
# cost in builds that don't use the feature.
typescript = []

[dependencies]
proc-macro2 = "1.0.79"
quote = "1.0.33"
syn = { version = "2.0.57", features = ["full", "visit", "visit-mut"] }
